<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090e">
  <title>DEFSOUL // GYM SYSTEM</title>

  <!-- Google Fonts: Bebas Neue, Outfit, Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #07090e;
      --bg-surface:   #0d1118;
      --panel:        #121822;
      --panel-hover:  #161f2c;
      --card-inner:   #090d13;
      --border:       rgba(255, 255, 255, 0.08);
      --border-lit:   rgba(255, 255, 255, 0.16);

      --text:         #c2d1e5;
      --text-muted:   #546984;
      --text-white:   #ffffff;

      --orange:       #ff6b00;
      --orange-glow:  rgba(255, 107, 0, 0.35);
      --orange-dim:   rgba(255, 107, 0, 0.14);

      --blue:         #00b4d8;
      --blue-lit:     #48cae4;
      --blue-glow:    rgba(0, 180, 216, 0.35);
      --blue-dim:     rgba(0, 180, 216, 0.12);

      --green:        #00e676;
      --green-glow:   rgba(0, 230, 118, 0.35);
      --green-dim:    rgba(0, 230, 118, 0.12);

      --gold:         #f59e0b;
      --red:          #ff3b5c;

      --radius-sm:    8px;
      --radius-md:    12px;
      --radius-lg:    16px;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      padding-bottom: calc(140px + env(safe-area-inset-bottom, 20px));
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Ambient Athletic Grid & Glow */
    .gym-grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .gym-grid-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 20%, transparent 100%);
    }
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
    }
    .glow-1 { width: 380px; height: 380px; background: var(--blue); top: -120px; left: -80px; }
    .glow-2 { width: 340px; height: 340px; background: var(--orange); bottom: 15%; right: -70px; }

    /* ── HEADER NATIVO DE APP ── */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 9, 14, 0.95);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }
    .app-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue) 25%, var(--orange) 75%, transparent);
      opacity: 0.7;
    }
    .header-content {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 14px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-white);
    }
    .logo-pulse {
      width: 8px; height: 8px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--orange);
    }
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
    }
    .brand-title span { color: var(--orange); }

    .header-quick-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .header-icon-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .2s;
    }
    .header-icon-btn:hover {
      border-color: var(--orange);
      color: var(--text-white);
      background: var(--orange-dim);
    }
    .header-icon-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── TABS BAR HORIZONTAL ── */
    .tabs-bar {
      position: sticky;
      top: 56px;
      z-index: 99;
      background: rgba(7, 9, 14, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .tabs-scroll-track {
      max-width: 1040px;
      margin: 0 auto;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-scroll-track::-webkit-scrollbar { display: none; }
    .day-tab {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text-muted);
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
    }
    .day-tab.active {
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.22), rgba(255, 107, 0, 0.05));
      border-color: var(--orange);
      color: #ff9142;
      box-shadow: 0 0 12px var(--orange-glow);
    }
    .day-tab.done-tab::after {
      content: '';
      position: absolute;
      top: 5px; right: 5px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* ── CONTAINER PRINCIPAL ── */
    .app-viewport {
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 10px;
      position: relative;
      z-index: 1;
    }

    /* ── STRIP DE RESUMO DE MÉTRICAS (COMPACTO NO CELULAR) ── */
    .metrics-summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: border-color .2s;
    }
    .metric-pill:hover { border-color: var(--border-lit); }
    .metric-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }
    .metric-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1;
    }
    .metric-value small {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 2px;
    }

    /* ── HERO BANNER DA SESSÃO ── */
    .session-hero {
      background: linear-gradient(180deg, rgba(18, 24, 34, 0.95), rgba(13, 17, 24, 0.85));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hero-top-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .session-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 38px;
      letter-spacing: 2px;
      line-height: 0.95;
      color: var(--text-white);
    }
    .hero-progress-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-inner);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }
    .prog-track-bar {
      width: 70px; height: 6px;
      background: #141b26;
      border-radius: 99px;
      overflow: hidden;
    }
    .prog-fill-bar {
      height: 100%; width: 0;
      background: linear-gradient(90deg, var(--orange), var(--green));
      border-radius: 99px;
      transition: width .4s ease;
    }
    .prog-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
    }

    .hero-buttons-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-session {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .2s;
      border: 1px solid var(--border-lit);
    }
    .btn-session.finish {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.22), rgba(0, 230, 118, 0.05));
      border-color: var(--green);
      color: var(--green);
    }
    .btn-session.reset {
      background: var(--card-inner);
      border-color: var(--border);
      color: var(--text-muted);
    }

    /* ── EXERCISE CARDS MOBILE-FIRST (SEM SCROLL HORIZONTAL) ── */
    .exercise-list-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ex-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      position: relative;
      box-shadow: 0 4px 18px rgba(0,0,0,0.3);
    }
    .ex-card.completed-card {
      border-color: rgba(0, 230, 118, 0.4);
      background: linear-gradient(180deg, rgba(0, 230, 118, 0.04) 0%, var(--panel) 100%);
    }

    .ex-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .ex-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .ex-number-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--orange);
      background: var(--card-inner);
      padding: 4px 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ex-name-meta { min-width: 0; }
    .ex-name-meta h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-white);
      line-height: 1.15;
      white-space: normal;
      word-break: break-word;
    }
    .ex-target-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* BADGE LIMPO (SEM LINHA EMBAIXO) */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 99px;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1;
      border: 1px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-pill.progression {
      background: var(--orange-dim);
      border-color: rgba(255, 107, 0, 0.45);
      color: #ff9142;
    }
    .badge-pill.warmup {
      background: var(--green-dim);
      border-color: rgba(0, 230, 118, 0.35);
      color: var(--green);
    }
    .badge-pill.isometric {
      background: var(--blue-dim);
      border-color: rgba(0, 180, 216, 0.35);
      color: var(--blue-lit);
    }

    /* TRILHA DE EVOLUÇÃO (HORIZONTALLY SCROLLABLE ONLY ON DEMAND) */
    .progression-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--card-inner);
      border: 1px solid rgba(255, 107, 0, 0.25);
      border-radius: 6px;
      padding: 6px 9px;
      margin-bottom: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      overflow-x: auto;
      scrollbar-width: none;
      white-space: nowrap;
    }
    .progression-breadcrumbs::-webkit-scrollbar { display: none; }
    .breadcrumbs-label {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--orange);
      flex-shrink: 0;
    }
    .bc-step {
      background: var(--panel);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text-white);
      flex-shrink: 0;
    }
    .bc-step.current {
      color: var(--green);
      border-color: rgba(0, 230, 118, 0.4);
      background: rgba(0, 230, 118, 0.08);
      font-weight: 700;
    }

    /* ── MOBILE CSS-GRID SETS TABLE (CANNOT OVERFLOW HORIZONTALLY!) ── */
    .mobile-sets-container {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .mobile-sets-head {
      display: grid;
      grid-template-columns: 54px 1fr 52px 42px;
      gap: 6px;
      padding: 7px 8px;
      background: #0c1017;
      border-bottom: 1px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-align: center;
      align-items: center;
    }
    .mobile-sets-head div:first-child { text-align: left; padding-left: 2px; }

    .mobile-set-row {
      display: grid;
      grid-template-columns: 54px 1fr 52px 42px;
      gap: 6px;
      padding: 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      align-items: center;
      text-align: center;
      transition: background .15s;
    }
    .mobile-set-row:last-child { border-bottom: none; }
    .mobile-set-row.is-done {
      background: rgba(0, 230, 118, 0.03);
    }

    .set-meta-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .set-num-pill {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-white);
      background: #141a24;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .set-ant-hint {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .set-ant-hint span { color: var(--orange); font-weight: 700; }

    /* Stepper & Weight Input */
    .weight-stepper-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .stepper-btn {
      width: 24px;
      height: 34px;
      background: #161e2b;
      border: 1px solid var(--border-lit);
      border-radius: 5px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stepper-btn:active {
      background: var(--orange);
      color: #000;
    }
    .stepper-input {
      width: 54px;
      height: 34px;
      background: #0a0e14;
      border: 1px solid var(--border-lit);
      border-radius: 5px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; /* EVITA ZOOM NO IPHONE! */
      font-weight: 700;
      color: var(--text-white);
      text-align: center;
      padding: 0;
    }
    .stepper-input:focus {
      outline: none;
      border-color: var(--orange);
    }

    .reps-input {
      width: 48px;
      height: 34px;
      background: #0a0e14;
      border: 1px solid var(--border-lit);
      border-radius: 5px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; /* EVITA ZOOM NO IPHONE! */
      font-weight: 700;
      color: var(--text-white);
      text-align: center;
      padding: 0;
      margin: 0 auto;
    }
    .reps-input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .check-set-btn {
      width: 38px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-lit);
      background: #141b26;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      margin: 0 auto;
      transition: all .2s;
    }
    .check-set-btn.checked {
      background: var(--green);
      border-color: var(--green);
      color: #04080e;
      box-shadow: 0 0 12px var(--green-glow);
    }

    /* Delta indicator badge */
    .delta-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      margin-left: 2px;
      display: inline-block;
    }
    .delta-badge.up {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid rgba(0, 230, 118, 0.35);
      color: var(--green);
    }
    .delta-badge.pr {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--gold);
    }

    /* ── NORMAL EXERCISE CHIPS (MANGUITO, ABDOMINAL, ETC) ── */
    .normal-exercise-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .chip-set-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all .15s;
    }
    .chip-set-btn:active { transform: scale(0.98); }
    .chip-set-btn.is-checked {
      background: rgba(0, 230, 118, 0.14);
      border-color: var(--green);
      color: var(--green);
    }

    .card-footer-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 6px;
      gap: 8px;
    }
    .btn-action-small {
      background: transparent;
      border: 1px dashed var(--border-lit);
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    /* ── DOCK REST TIMER FLUTUANTE ── */
    .rest-timer-dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(8, 11, 16, 0.98);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--border-lit);
      z-index: 1000;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 12px));
      box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
    }
    .dock-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .dock-timer-ring {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--orange);
      flex-shrink: 0;
    }
    .dock-timer-ring.finished {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 16px var(--green-glow);
    }
    .dock-target-text {
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-white);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      flex: 1;
    }
    .dock-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;

<script>

const K_WORKOUTS = 'defsoul_gym_workouts_v7';
const K_HISTORY  = 'defsoul_gym_history_v7';
const K_PROFILE  = 'defsoul_gym_profile_v7';

function loadWorkouts(){
  try {
    const raw = localStorage.getItem(K_WORKOUTS);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_GYM_DATA));
    const parsed = JSON.parse(raw);
    Object.values(parsed).forEach(arr => {
      arr.forEach(item => {
        if(item.obs && item.obs.toLowerCase().includes('aumenta')) {
          item.obs = 'Progressão de Carga';
        }
      });
    });
    return parsed;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_GYM_DATA)); }
}
function saveWorkouts(w){ localStorage.setItem(K_WORKOUTS, JSON.stringify(w)); }

function loadHistory(){
  try {
    const raw = localStorage.getItem(K_HISTORY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveHistory(h){ localStorage.setItem(K_HISTORY, JSON.stringify(h)); }

function loadProfile(){
  try {
    const raw = localStorage.getItem(K_PROFILE);
    return raw ? JSON.parse(raw) : { nome: '', idade: '', peso: '', altura: '' };
  } catch(e) { return { nome: '', idade: '', peso: '', altura: '' }; }
}
function saveProfile(p){ localStorage.setItem(K_PROFILE, JSON.stringify(p)); }

function getTodayIso(){ return new Date().toISOString().split('T')[0]; }

let activeDayTab = 'Segunda';

function showGymToast(msg){
  const t = document.getElementById('gymToastPopup');
  t.textContent = msg;
  t.classList.add('active');
  setTimeout(() => t.classList.remove('active'), 2200);
}

function playTimerBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch(e) {}
}

let timerInterval = null;
let timerSeconds = 0;

function startRestCountdown(sec = 60, exName = ''){
  clearInterval(timerInterval);
  timerSeconds = sec;
  const dock = document.getElementById('restTimerDock');
  const ring = document.getElementById('dockTimerRing');
  const txt = document.getElementById('dockTargetText');
  ring.classList.remove('finished');
  ring.textContent = timerSeconds;
  txt.textContent = exName ? exName : 'Respire fundo';
  dock.style.display = 'block';

  document.querySelectorAll('.dock-presets-row .dock-preset-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === `${sec}s`);
  });

  timerInterval = setInterval(() => {
    timerSeconds--;
    if(timerSeconds <= 0){
      clearInterval(timerInterval);
      ring.textContent = '0';
      ring.classList.add('finished');
      txt.textContent = 'Próxima série! BORA! 🔥';
      playTimerBeep();
      showGymToast('Descanso finalizado! 💪');
    } else {
      ring.textContent = timerSeconds;
    }
  }, 1000);
}

function adjustRestSeconds(delta){
  timerSeconds = Math.max(5, timerSeconds + delta);
  document.getElementById('dockTimerRing').textContent = timerSeconds;
}

function hideRestTimer(){
  clearInterval(timerInterval);
  document.getElementById('restTimerDock').style.display = 'none';
}

function isProgressionExercise(item){
  if(!item || !item.obs) return false;
  const obsLower = item.obs.toLowerCase();
  return obsLower.includes('progress') || obsLower.includes('aumenta') || obsLower.includes('carga');
}

function getProgressionTimeline(exerciseName){
  const history = loadHistory();
  const dates = Object.keys(history).sort();
  const timeline = [];
  let allTimeMax = 0;
  let previousSessionSets = null;
  const today = getTodayIso();

  dates.forEach(d => {
    for(const dayKey in history[d]){
      if(history[d][dayKey][exerciseName]){
        const sets = history[d][dayKey][exerciseName];
        let maxW = 0;
        sets.forEach(s => {
          const w = parseFloat(s.weight) || 0;
          if(w > maxW) maxW = w;
        });
        if(maxW > allTimeMax) allTimeMax = maxW;
        if(maxW > 0){
          timeline.push({ date: d, maxWeight: maxW, sets });
        }
        if(d !== today && sets.length > 0){
          previousSessionSets = sets;
        }
      }
    }
  });
  return { timeline, allTimeMax, previousSessionSets };
}

function parseSetsNumber(seriesStr){
  if(!seriesStr) return 3;
  const m = seriesStr.match(/(\d+)\s*[xX]/);
  return m ? parseInt(m[1], 10) : 3;
}
function parseRepsNumber(seriesStr){
  if(!seriesStr) return 10;
  const m = seriesStr.match(/[xX]\s*(\d+)/);
  return m ? parseInt(m[1], 10) : 10;
}

// ── RENDER SESSÃO DE TREINO ──
function renderWorkoutView(day){
  const workouts = loadWorkouts();
  const items = workouts[day] || [];
  const mount = document.getElementById('workoutViewMount');
  mount.innerHTML = '';

  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};

  // HERO COMPACTO
  const hero = document.createElement('div');
  hero.className = 'session-hero';
  hero.innerHTML = `
    <div class="hero-top-row">
      <h1 class="session-title">${day}</h1>
      <div class="hero-progress-pill">
        <div class="prog-track-bar">
          <div class="prog-fill-bar" id="sessionProgFill"></div>
        </div>
        <span class="prog-text" id="sessionProgText">0%</span>
      </div>
    </div>
    <div class="hero-buttons-row">
      <button class="btn-session finish" onclick="finishEntireWorkout()">Concluir Tudo ✓</button>
      <button class="btn-session reset" onclick="resetDaySession()">Resetar</button>
    </div>
  `;
  mount.appendChild(hero);

  if(items.length === 0){
    mount.innerHTML += `<div style="text-align:center;padding:40px 0;color:var(--text-muted)">Nenhum exercício cadastrado para ${day}.</div>`;
    return;
  }

  const list = document.createElement('div');
  list.className = 'exercise-list-container';

  let totalTargetSets = 0;
  let totalDoneSets = 0;
  let sessionVolume = 0;

  items.forEach((item, exIdx) => {
    const hasProgression = isProgressionExercise(item);
    const targetSets = parseSetsNumber(item.series);
    const targetReps = parseRepsNumber(item.series);
    const recordedSets = history[today][day][item.exercicio] || [];
    const { timeline, allTimeMax, previousSessionSets } = getProgressionTimeline(item.exercicio);

    totalTargetSets += targetSets;

    const card = document.createElement('div');
    card.className = 'ex-card';
    card.id = `card-ex-${exIdx}`;

    // Tag Limpa (SEM NENHUMA BARRINHA EMBAIXO)
    let badgeHtml = '';
    if(item.obs){
      const obsLower = item.obs.toLowerCase();
      if(obsLower.includes('progress') || obsLower.includes('carga') || obsLower.includes('aumenta')){
        badgeHtml = `<span class="badge-pill progression">🔥 PROGRESSÃO DE CARGA</span>`;
      } else if(obsLower.includes('aquecimento')){
        badgeHtml = `<span class="badge-pill warmup">AQUECIMENTO</span>`;
      } else if(obsLower.includes('isometria')){
        badgeHtml = `<span class="badge-pill isometric">ISOMETRIA</span>`;
      } else {
        badgeHtml = `<span class="badge-pill isometric">${item.obs}</span>`;
      }
    }

    let cardHtml = `
      <div class="ex-card-header">
        <div class="ex-title-group">
          <span class="ex-number-badge">${String(exIdx + 1).padStart(2, '0')}</span>
          <div class="ex-name-meta">
            <h3>${item.exercicio}</h3>
            <div class="ex-target-text">Meta: ${item.series || '—'}</div>
          </div>
        </div>
        ${badgeHtml}
      </div>
    `;

    // EXERCÍCIO COM PROGRESSÃO DE CARGA: TABELA EM CSS-GRID MOBILE
    if(hasProgression){
      if(timeline.length > 0){
        const recent = timeline.slice(-4);
        const steps = recent.map((t, i) => {
          const isCurr = i === recent.length - 1;
          const dFmt = new Date(t.date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
          return `<span class="bc-step ${isCurr ? 'current' : ''}">${t.maxWeight}kg <small style="color:var(--text-muted);font-size:9px">(${dFmt})</small></span>`;
        }).join(' <span style="color:var(--text-muted);font-size:9px">➜</span> ');
        cardHtml += `
          <div class="progression-breadcrumbs">
            <span class="breadcrumbs-label">📈 Evolução:</span>
            ${steps}
          </div>
        `;
      }

      cardHtml += `
        <div class="mobile-sets-container">
          <div class="mobile-sets-head">
            <div>Série/Ant.</div>
            <div>Carga (kg)</div>
            <div>Reps</div>
            <div>Feito</div>
          </div>
          <div id="sets-rows-${exIdx}"></div>
        </div>
        <div class="card-footer-controls">
          <button class="btn-action-small" onclick="addSetRow('${day}', '${item.exercicio}')">+ Série</button>
          <button class="btn-action-small" onclick="startRestCountdown(60, '${item.exercicio}')">⏱ 60s</button>
        </div>
      `;

      card.innerHTML = cardHtml;
      const rowsMount = card.querySelector(`#sets-rows-${exIdx}`);
      const setsToRender = Math.max(targetSets, recordedSets.length);
      let isCardDone = setsToRender > 0;

      for(let sIdx = 0; sIdx < setsToRender; sIdx++){
        const prevSet = (previousSessionSets && previousSessionSets[sIdx]) ? previousSessionSets[sIdx] : null;
        const setInfo = recordedSets[sIdx] || {
          weight: prevSet ? prevSet.weight : '',
          reps: prevSet ? prevSet.reps : targetReps,
          done: false
        };

        const w = parseFloat(setInfo.weight) || 0;
        const prevW = prevSet ? (parseFloat(prevSet.weight) || 0) : 0;

        let deltaHtml = '';
        if(w > 0 && prevW > 0 && w > prevW){
          deltaHtml = `<span class="delta-badge up">+${w - prevW}k</span>`;
        }
        if(w > 0 && w >= allTimeMax && allTimeMax > 0){
          deltaHtml += `<span class="delta-badge pr">PR</span>`;
        }

        if(setInfo.done){
          totalDoneSets++;
          sessionVolume += w * (parseInt(setInfo.reps) || 0);
        } else {
          isCardDone = false;
        }

        const row = document.createElement('div');
        row.className = `mobile-set-row ${setInfo.done ? 'is-done' : ''}`;
        row.innerHTML = `
          <div class="set-meta-box">
            <span class="set-num-pill">S${sIdx + 1}</span>
            <span class="set-ant-hint">${prevSet ? `Ant: <span>${prevSet.weight}k</span>` : '1º'}</span>
          </div>
          <div class="weight-stepper-box">
            <button class="stepper-btn" onclick="stepWeightVal('${day}', '${item.exercicio}', ${sIdx}, -1)">-</button>
            <input type="number" class="stepper-input" value="${setInfo.weight || ''}" placeholder="${prevSet ? prevSet.weight : '0'}" step="0.5" inputmode="decimal" onchange="updateSetInfo('${day}', '${item.exercicio}', ${sIdx}, 'weight', this.value)">
            <button class="stepper-btn" onclick="stepWeightVal('${day}', '${item.exercicio}', ${sIdx}, +1)">+</button>
            ${deltaHtml}
          </div>
          <div>
            <input type="number" class="reps-input" value="${setInfo.reps || ''}" placeholder="${targetReps}" step="1" inputmode="numeric" onchange="updateSetInfo('${day}', '${item.exercicio}', ${sIdx}, 'reps', this.value)">
          </div>
          <div>
            <button class="check-set-btn ${setInfo.done ? 'checked' : ''}" onclick="toggleSetStatus('${day}', '${item.exercicio}', ${sIdx}, this, '${item.exercicio}')">✓</button>
          </div>
        `;
        rowsMount.appendChild(row);
      }

      if(isCardDone && setsToRender > 0) card.classList.add('completed-card');

    } else {
      // EXERCÍCIO NORMAL: CHIPS EM GRADE RESPONSIVA
      cardHtml += `
        <div class="normal-exercise-grid" id="normal-grid-${exIdx}"></div>
        <div class="card-footer-controls">
          <button class="btn-action-small" onclick="addNormalSet('${day}', '${item.exercicio}')">+ Série</button>
          <button class="btn-action-small" onclick="startRestCountdown(45, '${item.exercicio}')">⏱ 45s</button>
        </div>
      `;
      card.innerHTML = cardHtml;
      const grid = card.querySelector(`#normal-grid-${exIdx}`);
      const setsToRender = Math.max(targetSets, recordedSets.length);
      let isCardDone = setsToRender > 0;

      for(let sIdx = 0; sIdx < setsToRender; sIdx++){
        const setInfo = recordedSets[sIdx] || { reps: targetReps, done: false };
        if(setInfo.done){
          totalDoneSets++;
        } else {
          isCardDone = false;
        }

        const btn = document.createElement('button');
        btn.className = `chip-set-btn ${setInfo.done ? 'is-checked' : ''}`;
        btn.innerHTML = `<span>Série ${sIdx + 1}</span> <span>${setInfo.done ? '✓' : '○'}</span>`;
        btn.onclick = () => {
          toggleNormalSetStatus(day, item.exercicio, sIdx, item.exercicio);
        };
        grid.appendChild(btn);
      }

      if(isCardDone && setsToRender > 0) card.classList.add('completed-card');
    }

    list.appendChild(card);
  });

  mount.appendChild(list);

  // Progresso do dia
  const pct = totalTargetSets > 0 ? Math.round((totalDoneSets / totalTargetSets) * 100) : 0;
  const bar = document.getElementById('sessionProgFill');
  const txt = document.getElementById('sessionProgText');
  if(bar) bar.style.width = `${pct}%`;
  if(txt) txt.textContent = `${pct}%`;

  updateMetricsSummary(sessionVolume, totalDoneSets);
}

function toggleNormalSetStatus(day, exName, sIdx, title){
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};
  history[today][day][exName] = history[today][day][exName] || [];

  while(history[today][day][exName].length <= sIdx){
    history[today][day][exName].push({ done: false });
  }

  const isDone = !history[today][day][exName][sIdx].done;
  history[today][day][exName][sIdx].done = isDone;
  saveHistory(history);

  if(isDone){
    showGymToast('Série concluída! 💪');
    startRestCountdown(45, title);
  }

  renderWorkoutView(day);
  renderTabsTrack();
}

function addNormalSet(day, exName){
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};
  history[today][day][exName] = history[today][day][exName] || [];
  history[today][day][exName].push({ done: false });
  saveHistory(history);
  renderWorkoutView(day);
}

function stepWeightVal(day, exName, sIdx, delta){
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};
  history[today][day][exName] = history[today][day][exName] || [];

  while(history[today][day][exName].length <= sIdx){
    history[today][day][exName].push({ weight: '', reps: 10, done: false });
  }

  const curr = parseFloat(history[today][day][exName][sIdx].weight) || 0;
  history[today][day][exName][sIdx].weight = Math.max(0, curr + delta);
  saveHistory(history);
  renderWorkoutView(day);
}

function updateSetInfo(day, exName, sIdx, field, val){
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};
  history[today][day][exName] = history[today][day][exName] || [];

  while(history[today][day][exName].length <= sIdx){
    history[today][day][exName].push({ weight: '', reps: 10, done: false });
  }

  history[today][day][exName][sIdx][field] = val;
  saveHistory(history);
  recalcMetrics();
}

function toggleSetStatus(day, exName, sIdx, btn, title){
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};
  history[today][day][exName] = history[today][day][exName] || [];

  while(history[today][day][exName].length <= sIdx){
    history[today][day][exName].push({ weight: '', reps: 10, done: false });
  }

  const isDone = !history[today][day][exName][sIdx].done;
  history[today][day][exName][sIdx].done = isDone;

  const parent = btn.closest('.mobile-set-row');
  const wInput = parent.querySelector('.stepper-input');
  const rInput = parent.querySelector('.reps-input');
  if(!history[today][day][exName][sIdx].weight && wInput && wInput.value){
    history[today][day][exName][sIdx].weight = wInput.value;
  }
  if(!history[today][day][exName][sIdx].reps && rInput && rInput.value){
    history[today][day][exName][sIdx].reps = rInput.value;
  }

  saveHistory(history);
  btn.classList.toggle('checked', isDone);

  if(isDone){
    showGymToast('Série concluída! 🔥');
    startRestCountdown(60, title);
  }

  renderWorkoutView(day);
  renderTabsTrack();
}

function addSetRow(day, exName){
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][day] = history[today][day] || {};
  history[today][day][exName] = history[today][day][exName] || [];

  const last = history[today][day][exName].slice(-1)[0] || { weight: '', reps: 10 };
  history[today][day][exName].push({ weight: last.weight, reps: last.reps, done: false });
  saveHistory(history);
  renderWorkoutView(day);
}

function finishEntireWorkout(){
  const workouts = loadWorkouts();
  const items = workouts[activeDayTab] || [];
  const history = loadHistory();
  const today = getTodayIso();
  history[today] = history[today] || {};
  history[today][activeDayTab] = history[today][activeDayTab] || {};

  items.forEach(it => {
    const numSets = parseSetsNumber(it.series);
    const numReps = parseRepsNumber(it.series);
    history[today][activeDayTab][it.exercicio] = history[today][activeDayTab][it.exercicio] || [];
    for(let s = 0; s < numSets; s++){
      if(!history[today][activeDayTab][it.exercicio][s]){
        history[today][activeDayTab][it.exercicio].push({ weight: '', reps: numReps, done: true });
      } else {
        history[today][activeDayTab][it.exercicio][s].done = true;
      }
    }
  });

  saveHistory(history);
  showGymToast('Treino 100% concluído! 🏆');
  renderWorkoutView(activeDayTab);
  renderTabsTrack();
}

function resetDaySession(){
  if(!confirm(`Resetar todo o progresso de ${activeDayTab} hoje?`)) return;
  const history = loadHistory();
  const today = getTodayIso();
  if(history[today] && history[today][activeDayTab]){
    delete history[today][activeDayTab];
    saveHistory(history);
  }
  showGymToast('Sessão resetada.');
  renderWorkoutView(activeDayTab);
  renderTabsTrack();
}

function recalcMetrics(){
  const history = loadHistory();
  const today = getTodayIso();
  let vol = 0;
  let sets = 0;

  if(history[today] && history[today][activeDayTab]){
    Object.values(history[today][activeDayTab]).forEach(arr => {
      arr.forEach(s => {
        if(s.done){
          sets++;
          vol += (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0);
        }
      });
    });
  }
  updateMetricsSummary(vol, sets);
}

function updateMetricsSummary(vol = 0, sets = 0){

  const volEl = document.getElementById('statVolumeVal');

  } else {

  }

function renderTabsTrack(){
  const workouts = loadWorkouts();
  const track = document.getElementById('tabsScrollTrack');
  track.innerHTML = '';
  const days = Object.keys(workouts);
  const history = loadHistory();
  const today = getTodayIso();

  days.forEach(day => {
    const btn = document.createElement('button');
    btn.className = `day-tab ${day === activeDayTab ? 'active' : ''}`;
    btn.textContent = day;

    const dayData = history[today] && history[today][day];
    let isAllDone = false;
    if(dayData && workouts[day].length > 0){
      const completedExercises = Object.keys(dayData).length;
      if(completedExercises >= workouts[day].length) isAllDone = true;
    }
    if(isAllDone) btn.classList.add('done-tab');

    btn.onclick = () => {
      activeDayTab = day;
      renderTabsTrack();
      renderWorkoutView(day);
    };
    track.appendChild(btn);
  });
}

function exportBackupData(){

    workouts: loadWorkouts(),
    history: loadHistory(),
    profile: loadProfile(),
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });

  const a = document.createElement('a');
  a.href = url;

function importBackupData(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      if(d.workouts) saveWorkouts(d.workouts);
      if(d.history) saveHistory(d.history);
      if(d.profile) saveProfile(d.profile);
      showGymToast('Backup importado! 🚀');
      setTimeout(() => location.reload(), 1200);
    } catch(err) {
      alert('Arquivo de backup inválido.');
    }
  };
  r.readAsText(file);
}

function renderProgressionCanvas(){
  const sel = document.getElementById('selectProgressionEx');
  const exName = sel.value;
  const history = loadHistory();
  const dates = Object.keys(history).sort();
  const records = [];

  const tableWrap = document.getElementById('progressionTableHistory');
  tableWrap.innerHTML = '';

  dates.forEach(d => {
    for(const dayKey in history[d]){
      if(history[d][dayKey][exName]){
        const sets = history[d][dayKey][exName];
        let maxW = 0;
        sets.forEach(s => {
          const w = parseFloat(s.weight) || 0;
          if(w > maxW) maxW = w;
        });
        if(maxW > 0){
          records.push({ date: d, weight: maxW, sets });
        }
      }
    }
  });

  if(records.length > 0){
    let tHtml = `
      <table style="width:100%;font-size:12px;font-family:'Space Grotesk',sans-serif;border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:1px solid var(--border);color:var(--text-muted)">
            <th style="padding:6px;text-align:left">Data</th>
            <th style="padding:6px;text-align:center">Carga Máx</th>
            <th style="padding:6px;text-align:left">Séries</th>
          </tr>
        </thead>
        <tbody>
    `;
    records.slice().reverse().forEach(r => {
      const dFmt = new Date(r.date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      const setsStr = r.sets.map(s => `${s.weight}k×${s.reps}`).join(' | ');
      tHtml += `
        <tr style="border-bottom:1px solid rgba(255,255,255,0.04)">
          <td style="padding:6px;color:var(--text-muted)">${dFmt}</td>
          <td style="padding:6px;text-align:center;color:var(--orange);font-weight:bold">${r.weight}kg</td>
          <td style="padding:6px;color:var(--text-white)">${setsStr}</td>
        </tr>
      `;
    });
    tHtml += `</tbody></table>`;
    tableWrap.innerHTML = tHtml;
  } else {
    tableWrap.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:14px 0;text-align:center;">Nenhum registro com carga ainda para este exercício.</div>`;
  }

  const canvas = document.getElementById('canvasProgression');
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 480, H = 160;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  if(records.length < 2){
    ctx.fillStyle = 'rgba(84, 105, 132, 0.85)';
    ctx.font = '12px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Registre cargas em pelo menos 2 treinos.', W / 2, H / 2);
    return;
  }

  const weights = records.map(r => r.weight);
  const minW = Math.min(...weights) - 2;
  const maxW = Math.max(...weights) + 2;
  const pad = { l: 25, r: 25, t: 20, b: 30 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

  const xs = records.map((_, i) => pad.l + (i / (records.length - 1 || 1)) * cw);
  const ys = weights.map(w => pad.t + ch - ((w - minW) / (maxW - minW || 1)) * ch);

  const grad = ctx.createLinearGradient(0, pad.t, 0, H);
  grad.addColorStop(0, 'rgba(255, 107, 0, 0.35)');
  grad.addColorStop(1, 'rgba(0, 230, 118, 0)');
  ctx.beginPath();
  ctx.moveTo(xs[0], H - pad.b);
  xs.forEach((x, i) => ctx.lineTo(x, ys[i]));
  ctx.lineTo(xs[xs.length - 1], H - pad.b);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(xs[0], ys[0]);
  xs.forEach((x, i) => ctx.lineTo(x, ys[i]));
  ctx.strokeStyle = '#ff6b00';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  records.forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(xs[i], ys[i], 4, 0, Math.PI * 2);
    ctx.fillStyle = '#00e676';
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px Space Grotesk, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${r.weight}kg`, xs[i], ys[i] - 7);

    const dt = new Date(r.date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    ctx.fillStyle = 'rgba(194, 209, 229, 0.7)';
    ctx.font = '9px Space Grotesk, sans-serif';
    ctx.fillText(dt, xs[i], H - 8);
  });
}

    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.alignItems = 'center';
    row.style.justifyContent = 'space-between';
    row.style.padding = '8px 10px';
    row.style.background = 'var(--card-inner)';
    row.style.borderRadius = '6px';
    row.style.fontSize = '12px';
    row.innerHTML = `
      <div>
        <b style="color:var(--text-white)">${it.exercicio}</b>
        <span style="color:var(--text-muted);font-family:'Space Grotesk',sans-serif;margin-left:6px;">${it.series}</span>
        ${it.obs ? `<span style="color:${isProg ? 'var(--orange)' : 'var(--blue)'};margin-left:6px;font-weight:700">(${it.obs})</span>` : ''}
      </div>
      <button style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:2px 6px;" onclick="deleteExFromActiveDay(${idx})">×</button>
    `;
    list.appendChild(row);
  });

  openModal('modalManage');
}

function addExerciseToActiveDay(){
  const name = document.getElementById('manageNewName').value.trim();
  const series = document.getElementById('manageNewSeries').value.trim() || '4x10';
  const obs = document.getElementById('manageNewObs').value;

  if(!name){ showGymToast('Digite o nome do exercício!'); return; }

  const workouts = loadWorkouts();
  workouts[activeDayTab] = workouts[activeDayTab] || [];
  workouts[activeDayTab].push({ exercicio: name, series, obs });
  saveWorkouts(workouts);

  document.getElementById('manageNewName').value = '';
  document.getElementById('manageNewSeries').value = '';
  openManageModal();
  renderWorkoutView(activeDayTab);
  showGymToast('Exercício adicionado! 🏋️');
}

function deleteExFromActiveDay(idx){
  const workouts = loadWorkouts();
  workouts[activeDayTab].splice(idx, 1);
  saveWorkouts(workouts);
  openManageModal();
  renderWorkoutView(activeDayTab);
  showGymToast('Exercício removido.');
}

function resetWorkoutsToDefault(){
  if(!confirm('Restaurar ficha padrão para todos os dias?')) return;
  saveWorkouts(DEFAULT_GYM_DATA);
  openManageModal();
  renderTabsTrack();
  renderWorkoutView(activeDayTab);
  showGymToast('Ficha restaurada para o padrão.');
}

document.addEventListener('DOMContentLoaded', () => {
  renderTabsTrack();
  renderWorkoutView(activeDayTab);
  recalcMetrics();
  updateAthleteBanner();
});
</script>
</body>
</html>
